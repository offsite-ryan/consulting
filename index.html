      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans', Arial, sans-serif;
    }

    h1,
    h2,
    h3,
    .display {
      font-family: 'Space Grotesk', Arial, sans-serif;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 28px 60px;
    }

    /* ---------- Header ---------- */
    .banner {
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
      border-bottom: 1px solid var(--line);
      padding: 26px 28px;
    }

    .banner-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .mark {
      width: 52px;
      height: auto;
      flex: none;
    }

    .word-block {
      flex: 1;
      min-width: 240px;
    }

    .wordmark {
      font-weight: 700;
      font-size: 26px;
      letter-spacing: .3px;
      margin: 0;
    }

    .wordmark span {
      color: var(--green);
    }

    .role-line {
      font-size: 22px;
      color: var(--muted);
      margin-top: 3px;
    }

    .contact-block {
      text-align: right;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    .contact-block b {
      color: var(--ink);
    }

    @media (max-width:640px) {
      .contact-block {
        text-align: left;
      }
    }

    .header-qr-block {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      margin-left: 18px; flex: none;
    }
    .header-qr-block svg { width: 50px; height: 50px; }
    .header-qr-caption {
      font-size: 8.5px; color: var(--muted); text-align: center; max-width: 70px; line-height: 1.2;
    }
    .mark-avatar {
      border-radius: 50%; object-fit: cover;
    }
    .role-accent { color: var(--green); }

    .page1-footer {
      font-size: 12.5px; color: var(--muted); font-style: italic;
      text-align: center; max-width: 640px; margin: 0 auto; padding-top: 18px;
    }
    .page1-footer a { color: var(--green); font-style: normal; font-weight: 600; text-decoration: none; }

    /* ---------- Hero statement ---------- */
    .hero {
      padding: 38px 0 30px;
      border-bottom: 1px solid var(--line);
    }

    .hero p {
      font-size: 23px;
      line-height: 1.45;
      /* max-width: 1024px; */
      margin: 0;
      font-weight: 500;
    }

    .hero p b {
      color: var(--green);
      font-weight: 600;
    }

    /* ---------- Section labels ---------- */
    .section {
      padding: 34px 0;
      border-bottom: 1px solid var(--line);
    }

    .section:last-child {
      border-bottom: none;
    }

    .section-label {
      font-size: 11px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin: 0 0 18px 0;
    }

    .section-sub {
      font-size: 12.5px;
      color: var(--muted);
      margin: -14px 0 18px;
      font-style: italic;
    }

    /* ---------- Capability grid ---------- */
    .cap-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width:900px) {
      .cap-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width:600px) {
      .cap-grid {
        grid-template-columns: 1fr;
      }
    }

    .cap-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px 20px;
    }

    .cap-title {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 8px;
    }

    .cap-proof {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 16px;
      min-height: 58px;
    }

    .cap-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cap-bar-track {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: var(--bg2);
      overflow: hidden;
    }

    .cap-bar-fill {
      height: 100%;
      background: var(--green);
      border-radius: 3px;
    }

    .cap-years {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .cap-note {
      font-size: 11.5px;
      color: var(--muted);
      font-style: italic;
      margin-top: 8px;
    }

    /* ---------- Highlight projects ---------- */
    .proj-grid-highlights {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width:700px) {
      .proj-grid-highlights {
        grid-template-columns: 1fr;
      }
    }

    /* ---------- Anchor projects ---------- */
    .proj-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (max-width:700px) {
      .proj-grid {
        grid-template-columns: 1fr;
      }
    }

    .proj-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px 22px;
      position: relative;
    }

    .proj-num {
      font-size: 14px;
      letter-spacing: 1px;
      color: var(--gold);
      font-weight: 600;
      margin: 0 0 6px;
    }

    .proj-num-highlights {
      font-size: 14px;
      letter-spacing: 1px;
      color: var(--gold);
      font-weight: 600;
      margin: 0 0 6px;
    }

    .proj-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 8px;
    }

    .proj-body {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.55;
      margin: 0;
    }

    .proj-body b {
      color: var(--ink);
      font-weight: 600;
    }

    .proj-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }

    .proj-chip {
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 11px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: transparent;
    }

    /* ---------- Career strip ---------- */
    .career {
      display: flex;
      flex-direction: column;
      gap: 0;
      border-left: 2px solid var(--line);
      margin-left: 6px;
    }

    .career-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 18px;
      padding: 14px 0 14px 24px;
      position: relative;
    }

    .career-row::before {
      content: "";
      position: absolute;
      left: -7px;
      top: 20px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--green);
    }

    .career-row.current::before {
      background: var(--green);
    }

    .career-dates {
      font-size: 12.5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      padding-top: 2px;
    }

    .career-org {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 3px;
    }

    .career-org .tag {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .5px;
      color: var(--green);
      border: 1px solid var(--green-dim);
      background: var(--green-glow);
      border-radius: 10px;
      padding: 2px 9px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .career-roles {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }

    /* ---------- Client wall ---------- */
    .client-wall {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .client-chip {
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: var(--panel-2);
    }

    .chip-years-sub {
      color: var(--muted);
      font-weight: 400;
    }

    .assumption {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 14px;
      font-style: italic;
    }

    /* ---------- More detail (bottom, layer-two content) ---------- */
    .detail-entry {
      margin-bottom: 26px;
    }

    .detail-entry:last-child {
      margin-bottom: 0;
    }

    .detail-heading {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 8px;
      color: var(--ink);
    }

    .detail-body {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.65;
      margin: 0;
      max-width: 760px;
    }

    .detail-body b {
      color: var(--ink);
      font-weight: 600;
    }

    .detail-list {
      list-style: disc;
      margin: 0 0 16px;
      padding-left: 20px;
      max-width: 760px;
    }

    .detail-list:last-child {
      margin-bottom: 0;
    }

    .detail-list li {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 4px;
    }

    .detail-list li::marker {
      color: var(--green);
    }

    .detail-list b {
      color: var(--ink);
      font-weight: 600;
    }

    .detail-subheading {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 8px;
    }

    @media print {
      #more-detail {
        break-before: page;
        page-break-before: always;
        margin-top: 50px;
      }
      #personalSkillsPage {
        break-before: page;
        page-break-before: always;
      }
    }
  </style>
</head>

      function renderCapabilityCards() {
        const grid = document.getElementById('capGrid');
        if (!grid) return;
        grid.innerHTML = CONFIG.capabilities.map(c => {
          const widthPct = (Math.min(c.years, CONFIG.capMaxYears) / CONFIG.capMaxYears * 100).toFixed(1);
          const label = (c.yearsLabel || c.years) + ' yrs';
          const noteHtml = c.note ? `<p class="cap-note">${c.note}</p>` : '';
          return `
      <div class="cap-card">
        <h3 class="cap-title">${c.title}</h3>
        <p class="cap-proof">${c.proof}</p>
        <div class="cap-bar-row">
          <div class="cap-bar-track"><div class="cap-bar-fill" style="width:${widthPct}%"></div></div>
          <span class="cap-years">${label}</span>
        </div>
        ${noteHtml}
      </div>`;
        }).join('\n');
      }

      function renderAnchorProjects() {
        const grid = document.getElementById('projGrid');
        if (!grid) return;
        grid.innerHTML = CONFIG.anchorProjects.map(p => {
          const chipsHtml = (p.chips && p.chips.length)
            ? `<div class="proj-chips">${p.chips.map(c => `<span class="proj-chip">${c}</span>`).join('')}</div>`
            : '';
          return `
      <div class="proj-card">
        <p class="proj-num">${p.num}</p>
        <h3 class="proj-title">${p.title}</h3>
        <p class="proj-body">${p.body}</p>
        ${chipsHtml}
      </div>`;
        }).join('\n');
      }

      function renderHighlightProjects() {
        const grid = document.getElementById('projGridHighlights');
        if (!grid) return;
        grid.innerHTML = CONFIG.highlightProjects.map(p => {
          const chipsHtml = (p.chips && p.chips.length)
            ? `<div class="proj-chips">${p.chips.map(c => `<span class="proj-chip">${c}</span>`).join('')}</div>`
            : '';
          return `
      <div class="proj-card">
        <p class="proj-num-highlights">${p.num}</p>
        <h3 class="proj-title">${p.title}</h3>
        <p class="proj-body">${p.body}</p>
        ${chipsHtml}
      </div>`;
        }).join('\n');
      }

      function renderCareer() {
        const heading = document.getElementById('careerHeading');
        const rowsEl = document.getElementById('careerRows');
        const assumptionEl = document.getElementById('careerAssumption');
        if (heading) heading.textContent = CONFIG.career.heading;
        if (assumptionEl) assumptionEl.textContent = CONFIG.career.assumption;
        if (rowsEl) {
          rowsEl.innerHTML = CONFIG.career.rows.map(r => {
            const tag = r.current ? ' <span class="tag">Current</span>' : '';
            return `
      <div class="career-row${r.current ? ' current' : ''}">
        <div class="career-dates">${r.dates}</div>
        <div>
          <p class="career-org">${r.org}${tag}</p>
          <p class="career-roles">${r.roles}</p>
        </div>
      </div>`;
          }).join('\n');
        }
      }

      function renderClients() {
        const wall = document.getElementById('clientWall');
        if (!wall) return;
        wall.innerHTML = CONFIG.clients.map(c => `<span class="client-chip">${c}</span>`).join('\n');
      }

      function renderMoreDetail() {
        const intro = document.getElementById('moreDetailIntro');
        const entries = document.getElementById('moreDetailEntries');
        if (intro) intro.textContent = CONFIG.moreDetail.intro;
        if (entries) {
          entries.innerHTML = CONFIG.moreDetail.entries.map(e => `
    <div class="detail-entry">
      <h3 class="detail-heading">${e.heading}</h3>
      <ul class="detail-list">
        ${e.items.map(item => `<li>${item}</li>`).join('\n        ')}
      </ul>
    </div>`).join('\n');
        }
      }

      function renderPage1Footer() {
        const el = document.getElementById('page1Footer');
        if (!el) return;
        const url = 'https://' + CONFIG.header.website;
        el.innerHTML = `${CONFIG.page1Footer} <a href="${url}">View more</a> online.`;
      }

      function renderPersonalSkillsPage() {
        const cfg = CONFIG.personalSkillsPage;
        const pageSection = document.getElementById('personalSkillsPage');
        const detailWrap = document.getElementById('personalSkillsDetailWrap');

          return;
        }
        if (pageSection) pageSection.style.display = '';
        if (detailWrap) detailWrap.style.display = '';

        const label = document.getElementById('personalSkillsLabel');
        const sub = document.getElementById('personalSkillsSub');
        const groupsEl = document.getElementById('personalSkillsGroups');
        const detailEl = document.getElementById('personalSkillsDetail');

        if (label) label.textContent = cfg.sectionLabel;
        if (sub) sub.textContent = cfg.sectionSub;
        if (groupsEl) {
          groupsEl.innerHTML = cfg.groups.map(g => `
    <h3 class="detail-subheading" style="margin-top:18px;">${g.heading}</h3>
    <div class="client-wall">${g.chips.map(c => `<span class="client-chip">${c}</span>`).join('')}</div>`).join('\n');
        }
        if (detailEl) {
          detailEl.innerHTML = cfg.details.map(d => `
    <div class="detail-entry">
      <h3 class="detail-heading">${d.heading}</h3>
      <ul class="detail-list">
        ${d.items.map(item => `<li>${item}</li>`).join('\n        ')}
      </ul>
    </div>`).join('\n');
        }
      }
    </script>

    <script>
      function renderToolChips() {
        const wall = document.getElementById('toolsWall');
        if (!wall) return;
        const { basePadPx, extraMaxPx } = CONFIG.toolChipScale;
        const entries = [...CONFIG.tools].sort((a, b) => b.years - a.years);
        const values = entries.map(e => e.years);
        const minYears = Math.min(...values);
        const maxYears = Math.max(...values);
        const range = maxYears - minYears || 1; // avoid divide-by-zero if every entry is equal
        wall.innerHTML = entries.map(({ name, years }) => {
          const extra = ((years - minYears) / range) * extraMaxPx;
          const pad = (basePadPx + extra).toFixed(1);
          return `<span class="client-chip" style="padding-left:${pad}px; padding-right:${pad}px;">`
            + `${name}<span class="chip-years-sub"> · ${years}+yrs</span></span>`;
        }).join('\n');
      }
    </script>
